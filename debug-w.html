<!doctype html>
<html><head><meta charset="utf-8"><title>world debug</title>
<style>body{margin:0;background:#101018;overflow:auto}canvas{image-rendering:pixelated;display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script src="js/pixel.js"></script>
<script src="js/font.js"></script>
<script src="js/props.js"></script>
<script src="js/buildings.js"></script>
<script src="js/rules.js"></script>
<script src="js/maps.js"></script>
<script src="js/world.js"></script>
<script>
// ?map=valley | crowns | highland
const map = PK.maps.get(new URLSearchParams(location.search).get("map")) || PK.maps.get(PK.maps.DEFAULT);
const t0 = performance.now();
PK.world.build(map);
console.log("build ms", performance.now() - t0);
const [W, H] = map.size;
const S = +new URLSearchParams(location.search).get("s") || 2;
const c = document.getElementById("c");
c.width = W*S; c.height = H*S;
const g = c.getContext("2d"); g.imageSmoothingEnabled = false;
const b = document.createElement("canvas"); b.width=W; b.height=H; const bg = b.getContext("2d"); bg.imageSmoothingEnabled=false;
const view = { x: 0, y: 0, w: W, h: H };
function frame(now) {
  const T = now/1000;
  PK.world.drawGround(bg, T, view);
  for (const d of PK.world.doodads) bg.drawImage(d.spr.c, d.x - d.spr.ax, d.y - d.spr.ay);
  for (const [x, y] of map.trees) { const t = PK.props.trees[(x*7+y)%3 | 0]; bg.drawImage(t.trunk, x/2 - t.ax, y/2+15 - t.ay); bg.drawImage(t.crown[0], x/2 - t.ax, y/2+15 - t.ay); }
  for (const [x, y] of map.gold) { const m = PK.props.mine; bg.drawImage(m.c, x/2 - m.ax, y/2+13 - m.ay); }
  map.slots.forEach((s, i) => {
    for (const bd of [s.hq, ...s.buildings]) { const spr = PK.buildings.get(bd.type, PK.rules.TEAMS[i]); bg.drawImage(spr.c, bd.x/2 - spr.ax, bd.y/2 + 19 - spr.ay); }
  });
  PK.world.drawClouds(bg, T, view); PK.world.drawMist(bg, T, view); PK.world.drawGrade(bg, W, H);
  g.drawImage(b, 0, 0, W*S, H*S);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
